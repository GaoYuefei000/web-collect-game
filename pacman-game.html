<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>吃豆收集大作战</title>
<style>
  /* ==================== 页面样式 ==================== */
  :root {
    --bg-1: #0b1020;
    --bg-2: #161a2e;
    --accent: #ffd633;
    --text: #e6e8f0;
    --panel: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    /* 深色主题背景 */
    background: radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg-1));
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    gap: 16px;
    user-select: none;
  }

  /* 游戏标题 */
  .game-title {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(255, 214, 51, 0.45);
  }

  /* 得分面板 */
  .score-panel { display: flex; gap: 14px; }
  .score-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 22px;
    text-align: center;
    min-width: 120px;
    backdrop-filter: blur(4px);
  }
  .score-box .label {
    font-size: 12px;
    letter-spacing: 2px;
    color: #9aa3bd;
    margin-bottom: 4px;
  }
  .score-box .value {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .score-box.high .value { color: #7ee787; }

  /* 游戏画布（CSS 尺寸由 JS 按视口动态缩放，逻辑坐标固定 800×560） */
  .game-canvas {
    border-radius: 16px;
    box-shadow: 0 0 0 1px var(--border),
                0 20px 60px rgba(0, 0, 0, 0.55),
                0 0 40px rgba(80, 120, 255, 0.12);
    cursor: pointer;
    display: block;
    touch-action: manipulation;               /* 消除移动端点击/双击缩放延迟 */
    -webkit-tap-highlight-color: transparent;
  }

  /* 操作说明 */
  .instructions {
    font-size: 13px;
    color: #9aa3bd;
    letter-spacing: 1px;
    text-align: center;
    line-height: 1.7;
  }
  .instructions b { color: var(--accent); }

  /* 移动端虚拟方向键（仅触控设备显示） */
  .dpad {
    display: none;                 /* 默认隐藏，触控设备由 JS 加类后显示 */
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px;
    gap: 8px;
    justify-content: center;
    align-items: center;
  }
  .touch-device .dpad { display: grid; }
  .dpad-btn {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    touch-action: none;                       /* 禁止按钮上的触摸滚动/缩放 */
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  .dpad-btn.active {
    background: var(--accent);
    color: #1a1a1a;
    border-color: var(--accent);
  }
  .dpad-btn.up    { grid-column: 2; grid-row: 1; }
  .dpad-btn.left  { grid-column: 1; grid-row: 2; }
  .dpad-btn.down  { grid-column: 2; grid-row: 2; }
  .dpad-btn.right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

  <!-- 游戏标题 -->
  <h1 class="game-title">🟡 吃豆收集大作战</h1>

  <!-- 得分面板 -->
  <div class="score-panel">
    <div class="score-box">
      <div class="label">当前得分</div>
      <div class="value" id="score">0</div>
    </div>
    <div class="score-box high">
      <div class="label">最高分</div>
      <div class="value" id="highscore">0</div>
    </div>
  </div>

  <!-- 游戏画布（所有图形均用 Canvas 绘制） -->
  <canvas id="game" class="game-canvas" width="800" height="560"></canvas>

  <!-- 移动端虚拟方向键（触控设备显示） -->
  <div class="dpad">
    <button class="dpad-btn up"    type="button" data-dir="up"    aria-label="向上">▲</button>
    <button class="dpad-btn left"  type="button" data-dir="left"  aria-label="向左">◀</button>
    <button class="dpad-btn down"  type="button" data-dir="down"  aria-label="向下">▼</button>
    <button class="dpad-btn right" type="button" data-dir="right" aria-label="向右">▶</button>
  </div>

  <!-- 操作说明 -->
  <p class="instructions">
    使用 <b>↑ ↓ ← →</b> 方向键移动 &nbsp;·&nbsp; 吃豆得分 &nbsp;·&nbsp; 躲避幽灵<br>
    <b>黄色能量豆</b>可永久加速 &nbsp;·&nbsp; 得分越高幽灵越快<br>
    点击画布开始游戏 &nbsp;·&nbsp; 按 <b>Enter</b> 也可开始 / 重新开始
  </p>

<script>
"use strict";

/* =====================================================================
 * 一、基准配置区 —— 所有可调参数的“普通难度”基准值
 *    难度模式会在此基准上覆盖部分字段（见下方 DIFFICULTIES）
 * ===================================================================== */
const BASE_CONFIG = {
  // ---- 画布 ----
  canvasWidth: 800,          // 画布宽度（需与 <canvas> 的 width 保持一致）
  canvasHeight: 560,         // 画布高度（需与 <canvas> 的 height 保持一致）

  // ---- 玩家 ----
  playerSpeed: 260,          // 玩家移动速度（像素 / 秒）
  playerRadius: 16,          // 玩家身体半径

  // ---- 敌人 ----
  enemyCount: 5,             // 场上敌人数量（越多越难）
  enemySpeed: 130,           // 敌人移动速度（像素 / 秒，建议低于玩家速度）
  enemyRadius: 16,           // 敌人身体半径
  enemyAiMin: 0.4,           // 敌人改变方向的最短间隔（秒）
  enemyAiMax: 1.3,           // 敌人改变方向的最长间隔（秒）

  // ---- 收集物品 ----
  itemCount: 40,             // 场上维持的豆子数量
  itemRadius: 6,             // 普通豆子半径
  itemPoints: 10,            // 普通豆子分值
  powerItemRadius: 11,       // 大能量豆半径
  powerItemPoints: 50,       // 大能量豆分值
  powerItemChance: 0.15,     // 生成大能量豆的概率（0~1）
  spawnInterval: 1500,       // 额外奖励豆的生成间隔（毫秒）
  maxBonusItems: 8,          // 额外奖励豆最多可叠加多少个

  // ---- 成长 / 动态难度 ----
  playerSpeedBoost: 12,      // 每吃一个黄色能量豆，永久增加的移速（像素/秒）
  playerMaxSpeed: 420,       // 玩家移速上限（像素/秒）
  enemySpeedPerScore: 0.06,  // 每 1 分增加的敌人移速（像素/秒），得分越高幽灵越快
  enemyMaxSpeed: 320,        // 敌人移速上限（像素/秒）

  // ---- 动画 ----
  flickerSpeed: 4,           // 豆子闪烁速度
  mouthSpeed: 8,             // 吃豆嘴巴开合速度
};

/* =====================================================================
 * 二、难度模式配置 —— 三种难度，只覆盖与基准不同的字段
 * ===================================================================== */
const DIFFICULTIES = {
  easy: {                    // 简单：敌人少且慢、豆子多、能量豆多
    name: "简单",
    color: "#7ee787",
    enemyCount: 3,
    enemySpeed: 85,
    enemyAiMin: 0.6,
    enemyAiMax: 1.8,
    itemCount: 45,
    powerItemChance: 0.25,
    spawnInterval: 1200,
  },
  normal: {                  // 普通：与基准配置一致
    name: "普通",
    color: "#ffd633",
    enemyCount: 5,
    enemySpeed: 130,
    enemyAiMin: 0.4,
    enemyAiMax: 1.3,
    itemCount: 40,
    powerItemChance: 0.15,
    spawnInterval: 1500,
  },
  hard: {                    // 困难：敌人多且快、追踪更积极、豆子少
    name: "困难",
    color: "#ff5f6d",
    enemyCount: 8,
    enemySpeed: 175,
    enemyAiMin: 0.25,
    enemyAiMax: 0.9,
    itemCount: 30,
    powerItemChance: 0.08,
    spawnInterval: 2000,
  },
};

// 当前生效的配置（运行时由难度决定，初始为普通基准）
const CONFIG = Object.assign({}, BASE_CONFIG);

// 当前选中的难度（easy / normal / hard）
let difficulty = "normal";

// 应用难度：先把 CONFIG 重置为基准，再覆盖该难度的字段
function applyDifficulty() {
  Object.assign(CONFIG, BASE_CONFIG, DIFFICULTIES[difficulty]);
}

/* =====================================================================
 * 三、基础环境初始化
 * ===================================================================== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = CONFIG.canvasWidth;
canvas.height = CONFIG.canvasHeight;

// ---- 响应式画布：根据视口动态缩放 CSS 尺寸，逻辑坐标（800×560）保持不变 ----
function resizeCanvas() {
  const pad = 8;   // 画布四周留白
  // 测量画布之外各元素占用的高度（标题 + 面板 + 说明 + 方向键）
  const title = document.querySelector(".game-title").offsetHeight;
  const panel = document.querySelector(".score-panel").offsetHeight;
  const instr = document.querySelector(".instructions").offsetHeight;
  const dpad  = document.querySelector(".dpad").offsetHeight;
  // body 的上下 padding(40) + 元素间 gap(4×16) + 画布留白
  const chrome = 40 + 64 + title + panel + instr + dpad + pad * 2;

  const availW = window.innerWidth - pad * 2;
  const availH = window.innerHeight - chrome;
  // 保持纵横比缩放，且不放大超过原始尺寸（避免位图模糊）
  const scale = Math.min(availW / canvas.width, availH / canvas.height, 1);
  canvas.style.width  = Math.max(200, Math.floor(canvas.width * scale)) + "px";
  canvas.style.height = Math.max(140, Math.floor(canvas.height * scale)) + "px";
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", resizeCanvas);
resizeCanvas();

// 分数面板 DOM
const scoreEl = document.getElementById("score");
const highscoreEl = document.getElementById("highscore");

// 游戏状态机：start（待开始） / playing（进行中） / gameover（结束）
let state = "start";

// 分数
let score = 0;
let highScore = 0;

// 全局动画时钟（秒），供闪烁、嘴巴、漂浮等装饰动画使用
let elapsed = 0;

// 上一次帧时间戳（用于计算 delta time）
let lastTime = 0;

// 收集物生成计时器（毫秒）
let itemSpawnTimer = 0;

// 已吃到的黄色能量豆数量（每颗永久提升玩家移速）
let playerSpeedBoostCount = 0;

// 重新开始按钮的矩形区域（绘制时写入，点击时读取）
let restartBtnRect = null;

// 难度选择按钮的矩形区域（绘制时写入，点击时读取）
let difficultyBtnRects = [];

/* =====================================================================
 * 四、工具函数
 * ===================================================================== */
// 在 [min, max] 区间内取随机浮点数
function rand(min, max) {
  return Math.random() * (max - min) + min;
}
// 限制数值在 [min, max] 区间
function clamp(v, min, max) {
  return v < min ? min : (v > max ? max : v);
}
// 两点距离
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}
// 读取 / 写入最高分（localStorage，失败时静默降级为内存变量）
function loadHighScore() {
  try {
    const v = localStorage.getItem("pacman_highscore");
    if (v !== null) highScore = parseInt(v, 10) || 0;
  } catch (e) { /* 忽略存储异常 */ }
}
function saveHighScore() {
  try {
    localStorage.setItem("pacman_highscore", String(highScore));
  } catch (e) { /* 忽略存储异常 */ }
}

/* =====================================================================
 * 五、音效系统 —— 使用 Web Audio API 生成，无需外部音频文件
 * ===================================================================== */
let audioCtx = null;

// 初始化 / 恢复音频上下文（必须在用户点击等手势后调用）
function initAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

// 播放一个基础音：传入频率、类型、时长、音量、以及可选的下滑终点频率
function playTone(freq, endFreq, type, duration, volume) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const now = audioCtx.currentTime;

  osc.type = type;
  osc.frequency.setValueAtTime(freq, now);
  if (endFreq && endFreq !== freq) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), now + duration);
  }

  // 音量包络：快速起音 -> 指数衰减，避免爆音
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(now);
  osc.stop(now + duration);
}

// 拾取物品音效：清脆上扬的“叮”声
function playPickupSound(isPower) {
  if (isPower) {
    // 大能量豆：更亮、更高的双音
    playTone(660, 990, "sine", 0.18, 0.5);
    setTimeout(() => playTone(990, 1320, "sine", 0.16, 0.4), 60);
  } else {
    playTone(520, 880, "square", 0.12, 0.25);
  }
}

// 碰撞结束音效：低沉的下降噪声
function playGameOverSound() {
  playTone(300, 60, "sawtooth", 0.6, 0.5);
  setTimeout(() => playTone(180, 40, "square", 0.4, 0.3), 80);
}

/* =====================================================================
 * 六、游戏实体
 * ===================================================================== */
// 玩家（吃豆人）
const player = {
  x: CONFIG.canvasWidth / 2,
  y: CONFIG.canvasHeight / 2,
  r: CONFIG.playerRadius,
  angle: 0,     // 朝向角度（弧度），0 = 向右
};

// 收集物数组
let items = [];
// 敌人数组
let enemies = [];
// 粒子数组（拾取时的火花）
let sparkles = [];
// 浮动文字数组（拾取时飘出的 "+10"）
let floatTexts = [];

// 敌人配色
const ENEMY_COLORS = ["#ff4d6d", "#ff9f43", "#e056fd", "#22d3ee", "#34d399", "#5b8cff"];

/* ---- 收集物 ---- */
function spawnItem() {
  const isPower = Math.random() < CONFIG.powerItemChance;
  const r = isPower ? CONFIG.powerItemRadius : CONFIG.itemRadius;
  let x, y, tries = 0;
  // 随机生成位置，避开画布边缘与玩家出生点
  do {
    x = rand(r + 4, canvas.width - r - 4);
    y = rand(r + 4, canvas.height - r - 4);
    tries++;
  } while (dist({ x, y }, player) < 60 && tries < 50);
  items.push({
    x, y, r,
    points: isPower ? CONFIG.powerItemPoints : CONFIG.itemPoints,
    power: isPower,
    phase: Math.random() * Math.PI * 2,   // 随机相位，让闪烁错开
  });
}

/* ---- 敌人 ---- */
function spawnEnemy() {
  let x, y, tries = 0;
  // 敌人出生点远离玩家
  do {
    x = rand(CONFIG.enemyRadius, canvas.width - CONFIG.enemyRadius);
    y = rand(CONFIG.enemyRadius, canvas.height - CONFIG.enemyRadius);
    tries++;
  } while (dist({ x, y }, player) < 180 && tries < 80);
  // 初始随机方向
  const a = rand(0, Math.PI * 2);
  enemies.push({
    x, y,
    r: CONFIG.enemyRadius,
    vx: Math.cos(a) * getEnemySpeed(),
    vy: Math.sin(a) * getEnemySpeed(),
    color: ENEMY_COLORS[enemies.length % ENEMY_COLORS.length],
    phase: Math.random() * Math.PI * 2,   // 漂浮动画相位
    aiTimer: rand(CONFIG.enemyAiMin, CONFIG.enemyAiMax),
  });
}

/* ---- 粒子 / 浮动文字 ---- */
function spawnSparkles(x, y, color) {
  const n = 10;
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    const sp = rand(40, 140);
    sparkles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      life: rand(0.3, 0.6),
      maxLife: 0.6,
      color,
      r: rand(2, 4),
    });
  }
}
function spawnFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 0.9, maxLife: 0.9 });
}

/* =====================================================================
 * 七、世界重置 / 游戏流程控制
 * ===================================================================== */
// 获取玩家当前移速：基准速度 + 已吃黄色能量豆的永久加成（有上限）
function getPlayerSpeed() {
  return Math.min(CONFIG.playerSpeed + playerSpeedBoostCount * CONFIG.playerSpeedBoost, CONFIG.playerMaxSpeed);
}

// 获取敌人当前移速：基准速度 + 随得分增长的加成（有上限）
function getEnemySpeed() {
  return Math.min(CONFIG.enemySpeed + score * CONFIG.enemySpeedPerScore, CONFIG.enemyMaxSpeed);
}

// 重置整个场景（不改变 state 与分数）
function resetWorld() {
  player.x = canvas.width / 2;
  player.y = canvas.height / 2;
  player.angle = 0;

  items = [];
  enemies = [];
  sparkles = [];
  floatTexts = [];
  itemSpawnTimer = 0;
  playerSpeedBoostCount = 0;   // 重置移速加成

  // 生成初始豆子
  for (let i = 0; i < CONFIG.itemCount; i++) spawnItem();
  // 生成敌人
  for (let i = 0; i < CONFIG.enemyCount; i++) spawnEnemy();
}

// 开始游戏
function startGame() {
  initAudio();
  applyDifficulty();   // 应用当前选中难度
  score = 0;           // 先清零得分，保证初始敌人速度为基准值
  resetWorld();
  updateScoreUI();
  state = "playing";
}

// 游戏结束
function gameOver() {
  state = "gameover";
  playGameOverSound();
  // 更新最高分
  if (score > highScore) {
    highScore = score;
    saveHighScore();
  }
  updateScoreUI();
}

// 重新开始
function restartGame() {
  startGame();
}

// 更新分数面板 DOM
function updateScoreUI() {
  scoreEl.textContent = score;
  highscoreEl.textContent = highScore;
}

/* =====================================================================
 * 八、输入处理
 * ===================================================================== */
// 记录当前按下的方向键（支持多键组合，实现斜向移动）
const keys = new Set();

// ---- 移动端触控检测与虚拟方向键 ----
const isTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);
if (isTouch) {
  document.body.classList.add("touch-device");
  resizeCanvas();   // 方向键显示后重新计算画布尺寸
}

// 虚拟方向键 -> 方向键常量 映射（与键盘共用同一套 keys 逻辑）
const DIR_MAP = { up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight" };
document.querySelectorAll(".dpad-btn").forEach((btn) => {
  const dir = DIR_MAP[btn.dataset.dir];
  const press   = (e) => { e.preventDefault(); keys.add(dir);    btn.classList.add("active"); };
  const release = (e) => { e.preventDefault(); keys.delete(dir); btn.classList.remove("active"); };
  btn.addEventListener("pointerdown", press);
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointerleave", release);
  btn.addEventListener("pointercancel", release);
});

window.addEventListener("keydown", (e) => {
  const arrows = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
  if (arrows.includes(e.key)) {
    e.preventDefault();          // 阻止方向键滚动页面
    keys.add(e.key);
  }
  // Enter 键：开始 / 重新开始
  if (e.key === "Enter") {
    if (state === "start") startGame();
    else if (state === "gameover") restartGame();
  }
  // 数字键 1/2/3 快速选择难度（仅在开始界面）
  if (state === "start") {
    if (e.key === "1") { difficulty = "easy"; applyDifficulty(); resetWorld(); }
    else if (e.key === "2") { difficulty = "normal"; applyDifficulty(); resetWorld(); }
    else if (e.key === "3") { difficulty = "hard"; applyDifficulty(); resetWorld(); }
  }
});

window.addEventListener("keyup", (e) => {
  keys.delete(e.key);
});

// 窗口失焦时清空按键，避免“卡键”
window.addEventListener("blur", () => keys.clear());

// 点击画布：选择难度 / 启动游戏 / 点击重新开始按钮
canvas.addEventListener("click", (e) => {
  const rect = canvas.getBoundingClientRect();
  // 将页面坐标换算为画布内部坐标（适配 CSS 缩放）
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  if (state === "start") {
    // 先判断是否点击了某个难度按钮
    const hit = difficultyBtnRects.find(r =>
      mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h);
    if (hit) {
      difficulty = hit.key;
      applyDifficulty();
      resetWorld();       // 刷新预览场景，让背景与所选难度一致
      return;
    }
    // 否则点击画布任意位置开始游戏
    startGame();
  } else if (state === "gameover") {
    if (restartBtnRect &&
        mx >= restartBtnRect.x && mx <= restartBtnRect.x + restartBtnRect.w &&
        my >= restartBtnRect.y && my <= restartBtnRect.y + restartBtnRect.h) {
      restartGame();
    }
  }
});

/* =====================================================================
 * 九、更新逻辑
 * ===================================================================== */
function update(dt) {
  updatePlayer(dt);
  updateEnemies(dt);
  updateItems(dt);
  updateParticles(dt);
  checkCollisions();
}

// 玩家移动
function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys.has("ArrowLeft"))  dx -= 1;
  if (keys.has("ArrowRight")) dx += 1;
  if (keys.has("ArrowUp"))    dy -= 1;
  if (keys.has("ArrowDown"))  dy += 1;

  if (dx !== 0 || dy !== 0) {
    // 归一化，保证斜向移动速度不变
    const len = Math.hypot(dx, dy);
    const spd = getPlayerSpeed();      // 使用含移速加成的当前速度
    player.x += (dx / len) * spd * dt;
    player.y += (dy / len) * spd * dt;
    player.angle = Math.atan2(dy, dx);   // 朝向 = 移动方向
  }

  // 限制在画布内
  player.x = clamp(player.x, player.r, canvas.width - player.r);
  player.y = clamp(player.y, player.r, canvas.height - player.r);
}

// 敌人移动（随机游走 + 轻微追踪玩家）
function updateEnemies(dt) {
  for (const e of enemies) {
    e.aiTimer -= dt;
    // 每隔一小段时间重新决定方向，方向偏向玩家（增加挑战性）
    if (e.aiTimer <= 0) {
      e.aiTimer = rand(CONFIG.enemyAiMin, CONFIG.enemyAiMax);
      const base = Math.atan2(player.y - e.y, player.x - e.x);
      const a = base + rand(-0.5, 0.5);   // 在朝向玩家基础上加入随机偏角
      const spd = getEnemySpeed();        // 转向时套用当前动态速度
      e.vx = Math.cos(a) * spd;
      e.vy = Math.sin(a) * spd;
    }

    // 每帧让敌人当前速率平滑靠拢目标速率，使“得分越高幽灵越快”实时生效
    const target = getEnemySpeed();
    const cur = Math.hypot(e.vx, e.vy);
    if (cur > 0.001) {
      const ns = cur + (target - cur) * Math.min(1, dt * 3);
      const k = ns / cur;
      e.vx *= k;
      e.vy *= k;
    }

    e.x += e.vx * dt;
    e.y += e.vy * dt;

    // 撞墙反弹
    if (e.x < e.r)          { e.x = e.r;          e.vx = Math.abs(e.vx); }
    if (e.x > canvas.width - e.r)  { e.x = canvas.width - e.r;  e.vx = -Math.abs(e.vx); }
    if (e.y < e.r)          { e.y = e.r;          e.vy = Math.abs(e.vy); }
    if (e.y > canvas.height - e.r) { e.y = canvas.height - e.r; e.vy = -Math.abs(e.vy); }
  }
}

// 收集物：定时生成额外奖励豆
function updateItems(dt) {
  itemSpawnTimer += dt * 1000;
  if (itemSpawnTimer >= CONFIG.spawnInterval) {
    itemSpawnTimer = 0;
    // 只在上限内叠加奖励豆
    if (items.length < CONFIG.itemCount + CONFIG.maxBonusItems) {
      spawnItem();
    }
  }
}

// 粒子与浮动文字更新
function updateParticles(dt) {
  // 火花粒子
  for (let i = sparkles.length - 1; i >= 0; i--) {
    const s = sparkles[i];
    s.life -= dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vx *= 0.94;   // 阻尼
    s.vy *= 0.94;
    if (s.life <= 0) sparkles.splice(i, 1);
  }
  // 浮动文字
  for (let i = floatTexts.length - 1; i >= 0; i--) {
    const f = floatTexts[i];
    f.life -= dt;
    f.y -= 40 * dt;   // 向上漂浮
    if (f.life <= 0) floatTexts.splice(i, 1);
  }
}

// 碰撞检测
function checkCollisions() {
  // 玩家 vs 收集物
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (dist(player, it) < player.r + it.r) {
      // 加分
      score += it.points;
      updateScoreUI();
      // 音效 + 动画
      playPickupSound(it.power);
      spawnSparkles(it.x, it.y, it.power ? "#ffb300" : "#4dd7ff");

      // 黄色能量豆：额外永久提升移速
      if (it.power) {
        playerSpeedBoostCount++;
        spawnFloatText(it.x, it.y - 10, "移速↑ +" + it.points, "#ffd633");
      } else {
        spawnFloatText(it.x, it.y - 10, "+" + it.points, "#9be7ff");
      }

      // 移除并补一个新豆子，维持场上数量
      items.splice(i, 1);
      spawnItem();
    }
  }

  // 玩家 vs 敌人
  for (const e of enemies) {
    if (dist(player, e) < player.r + e.r) {
      gameOver();
      break;
    }
  }
}

/* =====================================================================
 * 十、渲染逻辑
 * ===================================================================== */
function render() {
  drawBackground();

  // 所有实体始终绘制（开始/结束界面作为半透明遮罩覆盖在上层）
  drawItems();
  drawEnemies();
  drawPlayer();
  drawSparkles();
  drawFloatTexts();

  // 游戏中左上角显示当前难度徽章与移速徽章
  if (state !== "start") {
    drawDifficultyBadge();
    drawSpeedBadge();
  }

  // 状态遮罩
  if (state === "start") drawStartOverlay();
  else if (state === "gameover") drawGameOverOverlay();
}

// 背景
function drawBackground() {
  ctx.fillStyle = "#0d1220";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 微弱网格点，增加质感
  ctx.fillStyle = "rgba(120, 140, 200, 0.08)";
  const gap = 40;
  for (let x = gap / 2; x < canvas.width; x += gap) {
    for (let y = gap / 2; y < canvas.height; y += gap) {
      ctx.beginPath();
      ctx.arc(x, y, 1.2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// 左上角难度徽章
function drawDifficultyBadge() {
  const d = DIFFICULTIES[difficulty];
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
  ctx.strokeStyle = d.color;
  ctx.lineWidth = 1.5;
  roundRect(12, 12, 68, 28, 8);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = d.color;
  ctx.font = "bold 15px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText(d.name, 12 + 34, 12 + 19);
  ctx.textAlign = "start";
  ctx.restore();
}

// 左上角移速徽章（实时显示玩家当前移速）
function drawSpeedBadge() {
  ctx.save();
  ctx.fillStyle = "rgba(255, 255, 255, 0.08)";
  ctx.strokeStyle = "#4dd7ff";
  ctx.lineWidth = 1.5;
  roundRect(88, 12, 96, 28, 8);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = "#9be7ff";
  ctx.font = "bold 14px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("移速 " + Math.round(getPlayerSpeed()), 88 + 48, 12 + 19);
  ctx.textAlign = "start";
  ctx.restore();
}

// 玩家（吃豆人）
function drawPlayer() {
  const p = player;
  // 嘴巴开合动画：始终轻微咀嚼，看起来更生动
  const mouth = 0.2 + Math.abs(Math.sin(elapsed * CONFIG.mouthSpeed)) * 0.4;

  ctx.save();
  ctx.translate(p.x, p.y);

  // 身体光晕
  const glow = ctx.createRadialGradient(0, 0, p.r * 0.5, 0, 0, p.r * 1.8);
  glow.addColorStop(0, "rgba(255, 214, 51, 0.35)");
  glow.addColorStop(1, "rgba(255, 214, 51, 0)");
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(0, 0, p.r * 1.8, 0, Math.PI * 2);
  ctx.fill();

  // 旋转到朝向，嘴巴朝运动方向
  ctx.rotate(p.angle);

  // 身体（扇形，留出嘴巴缺口）
  ctx.beginPath();
  ctx.arc(0, 0, p.r, mouth, Math.PI * 2 - mouth);
  ctx.lineTo(0, 0);
  ctx.closePath();
  ctx.fillStyle = "#ffd633";
  ctx.fill();

  // 眼睛
  ctx.beginPath();
  ctx.arc(p.r * 0.32, -p.r * 0.42, p.r * 0.13, 0, Math.PI * 2);
  ctx.fillStyle = "#1a1a1a";
  ctx.fill();

  ctx.restore();
}

// 敌人（幽灵）
function drawEnemies() {
  for (const e of enemies) {
    const r = e.r;
    const bob = Math.sin(elapsed * 3 + e.phase) * 2.5;  // 上下漂浮

    ctx.save();
    ctx.translate(e.x, e.y + bob);

    // 幽灵身体：顶部半圆 + 底部波浪裙摆
    ctx.beginPath();
    ctx.arc(0, 0, r, Math.PI, 0);          // 上半圆
    ctx.lineTo(r, r);                        // 右侧边
    const seg = 5;
    const step = (2 * r) / seg;
    for (let i = 0; i < seg; i++) {
      const sx = r - step * (i + 0.5);
      const sy = r - (i % 2 === 0 ? 5 : 0);   // 交替上下的锯齿
      ctx.lineTo(sx, sy);
    }
    ctx.lineTo(-r, 0);
    ctx.closePath();
    ctx.fillStyle = e.color;
    ctx.fill();

    // 眼睛（白色眼白）
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.25, r * 0.30, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( r * 0.35, -r * 0.25, r * 0.30, 0, Math.PI * 2); ctx.fill();
    // 瞳孔（朝移动方向偏移）
    const ex = Math.sign(e.vx) * r * 0.12;
    const ey = Math.sign(e.vy) * r * 0.12;
    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(-r * 0.35 + ex, -r * 0.25 + ey, r * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( r * 0.35 + ex, -r * 0.25 + ey, r * 0.14, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

// 收集物（豆子）
function drawItems() {
  for (const it of items) {
    // 闪烁效果：透明度随时间正弦波动
    const alpha = 0.45 + 0.55 * Math.abs(Math.sin(elapsed * CONFIG.flickerSpeed + it.phase));
    const pulse = it.power ? 1 + 0.2 * Math.sin(elapsed * CONFIG.flickerSpeed + it.phase) : 1;

    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.scale(pulse, pulse);

    if (it.power) {
      // 大能量豆：金色，带光晕
      const g = ctx.createRadialGradient(0, 0, 1, 0, 0, it.r * 2.2);
      g.addColorStop(0, "rgba(255, 179, 0, " + alpha + ")");
      g.addColorStop(1, "rgba(255, 179, 0, 0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, it.r * 2.2, 0, Math.PI * 2); ctx.fill();

      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#ffb300";
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
    } else {
      // 普通豆子：青色小圆点
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#4dd7ff";
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// 火花粒子
function drawSparkles() {
  for (const s of sparkles) {
    const a = clamp(s.life / s.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 浮动文字
function drawFloatTexts() {
  for (const f of floatTexts) {
    const a = clamp(f.life / f.maxLife, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = f.color;
    ctx.font = "bold 18px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = "start";
}

// 开始提示遮罩（含难度选择）
function drawStartOverlay() {
  ctx.fillStyle = "rgba(6, 10, 20, 0.78)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = "center";

  // 标题
  ctx.fillStyle = "#ffd633";
  ctx.font = "bold 40px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("吃豆收集大作战", canvas.width / 2, 130);

  // 难度选择标签
  ctx.fillStyle = "#9aa3bd";
  ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("选择难度（数字键 1 / 2 / 3 也可切换）", canvas.width / 2, 205);

  // 三个难度按钮
  const btnW = 150, btnH = 62, gap = 22;
  const totalW = btnW * 3 + gap * 2;
  const startX = (canvas.width - totalW) / 2;
  const btnY = 228;
  difficultyBtnRects = [];

  const order = ["easy", "normal", "hard"];
  order.forEach((key, i) => {
    const bx = startX + i * (btnW + gap);
    const d = DIFFICULTIES[key];
    const selected = key === difficulty;

    // 记录按钮矩形，供点击检测
    difficultyBtnRects.push({ key, x: bx, y: btnY, w: btnW, h: btnH });

    // 按钮背景与边框
    ctx.fillStyle = selected ? d.color : "rgba(255, 255, 255, 0.08)";
    ctx.strokeStyle = selected ? d.color : "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 2;
    roundRect(bx, btnY, btnW, btnH, 12);
    ctx.fill();
    ctx.stroke();

    // 难度名称
    ctx.fillStyle = selected ? "#1a1a1a" : "#e6e8f0";
    ctx.font = "bold 19px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText(d.name, bx + btnW / 2, btnY + 27);

    // 敌人数量说明
    ctx.fillStyle = selected ? "rgba(0, 0, 0, 0.62)" : "#9aa3bd";
    ctx.font = "12px 'Segoe UI', 'Microsoft YaHei', sans-serif";
    ctx.fillText("敌人 ×" + d.enemyCount, bx + btnW / 2, btnY + 47);
  });

  // 开始提示（呼吸闪烁）
  const pulse = 0.6 + 0.4 * Math.sin(elapsed * 3);
  ctx.globalAlpha = pulse;
  ctx.fillStyle = "#ffffff";
  ctx.font = "22px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("点击画布开始游戏", canvas.width / 2, 360);
  ctx.globalAlpha = 1;

  // 底部操作说明
  ctx.fillStyle = "#9aa3bd";
  ctx.font = "14px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("↑ ↓ ← → 移动 · 收集豆子 · 躲避幽灵", canvas.width / 2, 400);
  ctx.textAlign = "start";
}

// 游戏结束遮罩
function drawGameOverOverlay() {
  ctx.fillStyle = "rgba(6, 10, 20, 0.78)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 面板背景
  const pw = 380, ph = 260;
  const px = canvas.width / 2 - pw / 2;
  const py = canvas.height / 2 - ph / 2;

  ctx.fillStyle = "rgba(28, 34, 58, 0.95)";
  ctx.strokeStyle = "rgba(255, 214, 51, 0.4)";
  ctx.lineWidth = 2;
  roundRect(px, py, pw, ph, 18);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = "center";
  // 标题
  ctx.fillStyle = "#ff5f6d";
  ctx.font = "bold 34px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("游戏结束", canvas.width / 2, py + 54);

  // 难度
  ctx.fillStyle = DIFFICULTIES[difficulty].color;
  ctx.font = "16px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("难度：" + DIFFICULTIES[difficulty].name, canvas.width / 2, py + 84);

  // 最终得分
  ctx.fillStyle = "#e6e8f0";
  ctx.font = "20px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("最终得分", canvas.width / 2, py + 126);
  ctx.fillStyle = "#ffd633";
  ctx.font = "bold 40px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText(score, canvas.width / 2, py + 170);

  // 重新开始按钮
  const bw = 180, bh = 48;
  const bx = canvas.width / 2 - bw / 2;
  const by = py + ph - 76;
  restartBtnRect = { x: bx, y: by, w: bw, h: bh };

  ctx.fillStyle = "#ffd633";
  roundRect(bx, by, bw, bh, 24);
  ctx.fill();
  ctx.fillStyle = "#1a1a1a";
  ctx.font = "bold 20px 'Segoe UI', 'Microsoft YaHei', sans-serif";
  ctx.fillText("重新开始", canvas.width / 2, by + 32);
  ctx.textAlign = "start";
}

// 圆角矩形辅助函数
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* =====================================================================
 * 十一、游戏主循环 —— requestAnimationFrame
 * ===================================================================== */
function loop(timestamp) {
  // 计算两帧间的时间差（秒），并限制上限避免切后台后跳帧
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05) || 0;
  lastTime = timestamp;

  // 全局时钟
  elapsed = timestamp / 1000;

  // 只有游戏进行中才更新逻辑
  if (state === "playing") {
    update(dt);
  }

  render();

  requestAnimationFrame(loop);
}

/* =====================================================================
 * 十二、启动
 * ===================================================================== */
loadHighScore();
updateScoreUI();
applyDifficulty();     // 初始为普通难度
resetWorld();          // 预填充场景，让开始画面背后有内容
lastTime = performance.now();
requestAnimationFrame(loop);
</script>
